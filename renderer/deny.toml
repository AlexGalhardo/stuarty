# The licence allowlist is the one of internal/tools/notices (SDD-009 section 12.2), minus the
# licences that must not link into the renderer (rule .agents/rules/rust.md 3). A Go test of
# internal/tools/notices keeps the two lists consistent: never add a licence to one without the other.

[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"0BSD",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

# unicode-ident (a dependency of wasm-bindgen-shared) carries the Unicode-3.0 data licence next to
# MIT OR Apache-2.0. The notices allow-list does not list Unicode-3.0, so the exception is limited to
# this crate until the author decides whether to allow it in both lists.
exceptions = [{ allow = ["Unicode-3.0"], crate = "unicode-ident" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
unmaintained = "workspace"
