[package]
name = "stuarty-renderer-gpu"
description = "The wgpu path of the Stuarty renderer (ADR-0029 stage D, SDD-013 section 3.8): the same frame plan drawn on the GPU."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stuarty-render"
path = "src/bin/stuarty-render.rs"

[dependencies]
stuarty-renderer = { version = "=0.0.0", path = "../stuarty-renderer" }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }

[lints]
workspace = true
