{{/* layout: none */}}<!doctype html>
<html lang="{{or locale "en"}}" data-hydrating>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Stuarty</title>
	<link rel="icon" type="image/svg+xml" href="/icon.svg">
	<meta property="csp-nonce" nonce="{{cspNonce}}">
	<meta name="color-scheme" content="dark light">
	<script nonce="{{cspNonce}}">var d=document.documentElement;d.classList.add("dark");try{if(localStorage.getItem("theme")==="light")d.classList.remove("dark")}catch(e){}</script>
	{{analytics}}
	{{viteReactRefresh}}
	{{vite "resources/css/app.css" "resources/js/app.tsx"}}
	{{.Head}}
</head>
<body class="antialiased">
	<div data-vv-root class="isolate min-h-dvh">
		{{.Inertia}}
	</div>
</body>
</html>
