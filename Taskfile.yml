# yaml-language-server: $schema=https://taskfile.dev/schemas/taskfile.json
# Single entry point for local development and CI. Run `task --list`.
# Names follow vukem's Taskfile (SDD-009 section 14). Targets that need files
# of other tasks (notices, generate, site, image, release) are added with them.
version: "3"

vars:
  MARKDOWNLINT_VERSION: 0.24.1

env:
  # One golangci-lint cache per worktree: a cache shared by worktrees and by
  # concurrent runs makes gosec miss findings and nolintlint report its
  # directives as unused. A GOLANGCI_LINT_CACHE already in the environment (CI) wins.
  GOLANGCI_LINT_CACHE: '{{default (printf "%s/.cache/golangci-lint" (toSlash .ROOT_DIR)) .GOLANGCI_LINT_CACHE}}'

tasks:
  default:
    cmds:
      - task --list

  setup:
    desc: Verify required tools and install the git hooks
    cmds:
      - go version
      - golangci-lint version
      - bun --version
      - task: hooks
      - git worktree prune

  hooks:
    desc: Activate the hooks of .githooks/
    cmds:
      - git config core.hooksPath .githooks

  fmt:
    desc: Format Go code and the web front end
    cmds:
      - golangci-lint fmt ./...
      - cd web && bun run format

  lint:
    desc: Lint Go code, Markdown, the web front end and the site, and check the agent surface budget
    cmds:
      - task: lint:go
      - task: lint:md
      - task: lint:web
      - task: lint:site
      - task: lint:budget

  lint:go:
    desc: Run golangci-lint (linters and formatters)
    cmds:
      - golangci-lint run --allow-parallel-runners ./...

  lint:budget:
    desc: Measure the MCP tool list, the first discovery call and the domain descriptions against NFR-020
    cmds:
      - go run ./internal/tools/surfacebudget

  lint:md:
    desc: Run markdownlint-cli2 at the pinned version
    cmds:
      - bunx markdownlint-cli2@{{.MARKDOWNLINT_VERSION}} "**/*.md"

  lint:web:
    desc: Typecheck and lint the web front end with Biome
    dir: web
    cmds:
      - bun run typecheck
      - bun run lint
      - bun run check:thin-client
      - bun run check:i18n

  lint:site:
    desc: Lint the documentation site and check its build (skipped while site/ does not exist)
    status:
      - test ! -f site/package.json
    cmds:
      - cd site && npm ci
      - cd site && npm run lint
      - cd site && npm run build
      - cd site && npm run check:built

  labels:sync:
    desc: Create or update the GitHub labels listed in .github/labels.txt (never deletes; needs gh auth)
    cmds:
      - go run ./internal/tools/labelsync .github/labels.txt
  codegen:
    desc: Regenerate the contracts (core/schema and web/resources/js/generated), the material for agents (web/app/agentdocs/out, one guide page per domain) and the FFmpeg pins (internal/ffmpegpins)
    cmds:
      - go run ./internal/tools/contractgen
      - go run ./internal/tools/ffmpegpins
      - go run ./web/cmd/gen-agent-docs
      - cd web && bun run codegen:ts

  test:
    desc: Run the Go tests
    cmds:
      - go test -short -count=1 -timeout 20m ./...

  test:race:
    desc: Run the Go tests of core, service and web/app with the race detector (needs cgo)
    cmds:
      - go test -race -short -count=1 -timeout 30m ./core/... ./service/... ./web/app/...

  test:web:
    desc: Run the web unit tests (Vitest)
    dir: web
    cmds:
      - bun run test

  test:cover:
    desc: Run the Go tests with coverage and apply the coverage gate (SDD-009 section 13.2)
    cmds:
      - go test -short -count=1 -coverprofile=coverage.out ./...
      - go run ./internal/tools/covergate coverage.out

  gate:
    desc: "The full local release gate (task gate -- <tag>); prints GATE_FAIL=n"
    cmds:
      - bash scripts/gate.sh {{.CLI_ARGS}}

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail when go.mod or go.sum need tidying
    cmds:
      - go mod tidy -diff

  changelog:
    desc: Preview the next changelog section (writes nothing)
    cmds:
      - git cliff --config .config/cliff.toml --unreleased --strip all

  release:pr-body:
    desc: "Refresh the body of the open release pull request from the commits (task release:pr-body -- vX.Y.Z)"
    cmds:
      - bash scripts/release-pr-body.sh {{.CLI_ARGS}}

  release:prepare:
    desc: "On branch release/vX.Y.Z: write the changelog section and commit it (task release:prepare -- vX.Y.Z)"
    cmds:
      - go run ./internal/tools/release prepare {{.CLI_ARGS}}

  release:tag:
    desc: "On main after the release pull request merged: tag and push the tag (task release:tag -- vX.Y.Z)"
    cmds:
      - go run ./internal/tools/release tag {{.CLI_ARGS}}

  release:notes:
    desc: "Print the notes release.yml will publish (task release:notes -- vX.Y.Z)"
    cmds:
      - go run ./internal/tools/release notes {{.CLI_ARGS}}

  release:snapshot:
    desc: Build the six archives locally with GoReleaser, signing and SBOMs skipped, publishing nothing
    cmds:
      - goreleaser release --snapshot --clean --skip=sign,sbom --config .config/goreleaser.yaml
  release:binaries:
    desc: "Build the six archives with GoReleaser; SNAPSHOT=1 builds without publishing or signing (needs syft on PATH)"
    cmds:
      - goreleaser release --clean --config .config/goreleaser.yaml {{if .SNAPSHOT}}--snapshot --skip=publish,sign{{end}}

  release:verify:
    desc: "Verify a published release: signature, checksums, provenance and the image digests (task release:verify -- vX.Y.Z)"
    cmds:
      - bash scripts/release-verify.sh {{.CLI_ARGS}}

  release:preflight:
    desc: Everything the CI-equivalent checks run, plus the notices, generated files, site and image
    cmds:
      - task: ci
      - task: generate:check
      - task: site:build
      - task: image:smoke

  generate:check:
    desc: Regenerate every generated folder and fail when one differs from what is committed
    cmds:
      - task: codegen
      - cd site && npm run reference
      - git diff --exit-code -- core/schema web/resources/js/generated site/generated site/content/generated internal/ffmpegpins web/app/agentdocs/out

  site:build:
    desc: Build the documentation site and run its checks
    dir: site
    cmds:
      - npm ci
      - npm run check:mdx
      - npm run build
      - npm run check:built
      - npm run reference:check
      - npm run check:last-updated

  image:build:
    desc: Build the container image as stuarty:local
    cmds:
      - docker build -f .config/docker/stuarty.Dockerfile -t stuarty:local .

  image:smoke:
    desc: Smoke test the image built by image:build
    cmds:
      - bash scripts/image-smoke.sh stuarty:local

  notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md and the licence texts under licenses/
    cmds:
      - bun install --frozen-lockfile --cwd web
      - go run ./internal/tools/notices

  notices:check:
    desc: Fail with a diff when the third-party notices are stale or a licence is not allowed
    cmds:
      - bun install --frozen-lockfile --cwd web
      - go run ./internal/tools/notices -check

  ci:
    desc: Everything the pull request pipeline runs locally
    cmds:
      - task: lint
      - task: vet
      - task: test
      - task: test:web
      - task: tidy:check
      - task: notices:check
