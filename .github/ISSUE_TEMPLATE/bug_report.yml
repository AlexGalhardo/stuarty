name: Bug report
description: Something does not work as documented.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. One bug per issue. Security problems go to a
        [private advisory](https://github.com/AlexGalhardo/stuarty/security/advisories/new), never here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of the product. It becomes the commit scope.
      options: [core, timeline, schema, command, plan, lint, engine, raster, ingest, export, image, transcribe, installers, service, workspace, web, api, mcp, cli, ui, site, docs, repo, ci, deps, adr, sdd, go, security, other]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options: [Browser UI, MCP, CLI, HTTP API, Export or render, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The actual behaviour, with the error code, message or output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Link the documentation page or specification that says so, if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest commands, operations or project that show the bug. Do not attach private footage.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stuarty version
      description: Output of stuarty version, or a commit SHA.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Local, Network, Not sure]
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: I reproduced it on the latest release or on main.
          required: true
