name: release

# Builds the stuarty binaries when a version tag is pushed. The release and
# its notes are created here from CHANGELOG.md (empty notes fail the run);
# GoReleaser only attaches the archives, checksums, SBOMs (syft) and the cosign
# keyless bundle of checksums.txt.
#
# The installers (SDD-009 section 10.4, P1-REL-010) are built and tested by
# installers.yml, which this workflow calls first. GoReleaser makes the .deb files
# itself; the Windows, AppImage and macOS installers are added to the release, to
# checksums.txt and to its signature after GoReleaser has run. The image job
# (SDD-009 sections 9.3 and 11, P1-REL-009) builds and smoke tests the image,
# then publishes it to GHCR and Docker Hub for stable tags only.
#
# The desktop application (desktop.yml, P3-REL-003, D-033) is built into a Windows installer, a Debian
# package and a macOS disk image per architecture, none signed with a paid certificate. They join the
# release like the installers above, with one SBOM of the application's Go modules; checksums.txt lists
# them, its cosign signature covers them and every file is attested. For a stable tag only, the feed of
# the desktop auto-update (SDD-009 section 10.5, P3-REL-004) is signed with the secret
# UPDATE_FEED_SIGNING_KEY and attached as feed.json, and site.yml is run to publish the feed and the
# installers it lists on GitHub Pages. A stable tag without that secret or without the variable
# UPDATE_FEED_PUBLIC_KEY fails in the first minutes, before anything is built.
#
# workflow_dispatch takes the version to build, because a tag push does not
# always start a run: GitHub creates no push event when more than three tags
# go up in a single push. Version tags are pushed one at a time, and a tag
# that went up without a run is recovered by dispatching that version here
# instead of moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (vX.Y.Z). The tag must already be pushed."
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      version: ${{ steps.tag.outputs.version }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_VERSION:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::not a version tag: $tag"
              exit 1
              ;;
          esac
          echo "ref=refs/tags/$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
          # Only vX.Y.Z feeds the desktop auto-update; vX.Y.Z-rc.1 and friends never do.
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >>"$GITHUB_OUTPUT"
          else
            echo "stable=false" >>"$GITHUB_OUTPUT"
          fi

  # The only secret of the desktop release is the key that signs the update feed (D-033: no code signing
  # certificates exist). A stable release without it, or with a variable that is not its public half, stops
  # here, within minutes and before any build.
  preflight:
    needs: tag
    if: needs.tag.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the update feed key
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.UPDATE_FEED_PUBLIC_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::add the repository secret UPDATE_FEED_SIGNING_KEY (the 64 hex characters of the Ed25519 seed that signs the desktop update feed; CONTRIBUTING.md)"
            exit 1
          fi
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::add the repository variable UPDATE_FEED_PUBLIC_KEY (the public key of UPDATE_FEED_SIGNING_KEY; CONTRIBUTING.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The variable is the public key of the secret
        env:
          UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.UPDATE_FEED_PUBLIC_KEY }}
        run: |
          derived="$(go run ./internal/tools/updatefeed pubkey)"
          if [ "$derived" != "$PUBLIC_KEY" ]; then
            echo "::error::UPDATE_FEED_PUBLIC_KEY is not the public key of UPDATE_FEED_SIGNING_KEY (it should be $derived)"
            exit 1
          fi

  installers:
    needs: [tag, preflight]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}
      version: ${{ needs.tag.outputs.version }}

  desktop:
    needs: [tag, preflight, installers]
    if: ${{ !cancelled() && !failure() }}
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}
      version: ${{ needs.tag.outputs.version }}

  goreleaser:
    needs: [tag, installers, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestations
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_VERSION:-$REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::not a version tag: $tag"
              exit 1
              ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          # Only vX.Y.Z moves the image's latest tag; vX.Y.Z-rc.1 and friends do not.
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >>"$GITHUB_OUTPUT"
          else
            echo "stable=false" >>"$GITHUB_OUTPUT"
          fi
      # GoReleaser reads the version from HEAD, so a dispatched run checks out
      # the tag itself rather than the branch the dispatch came from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      # The notes come from the changelog section of the tagged commit. The
      # heading match is literal: a regex with \[ never matches in awk.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[^]]+\]: / { exit }
            found
          ' CHANGELOG.md | sed '/./,$!d' >"$RUNNER_TEMP/notes.raw"
          printf '%s\n' "$(cat "$RUNNER_TEMP/notes.raw")" >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.raw"; then
            echo "::error::CHANGELOG.md has no entries for ${TAG#v}"
            exit 1
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${flags[@]}"
          fi
      - name: Install the web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Notices are current
        run: go run ./internal/tools/notices -check
      # The archives carry the three files of web/app/agentdocs/out/ under agent/ (goreleaser.yaml);
      # they must be what the binary of this tag prints (SDD-003 section 9 check 27).
      - name: The agent material equals agent:docs
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/stuarty" ./web/cmd/app
          "$RUNNER_TEMP/stuarty" agent:docs --print skill | cmp - web/app/agentdocs/out/SKILL.md
          "$RUNNER_TEMP/stuarty" agent:docs --print agents | cmp - web/app/agentdocs/out/AGENTS.snippet.md
          "$RUNNER_TEMP/stuarty" agent:docs --print instructions | cmp - web/app/agentdocs/out/mcp-instructions.txt
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The installers of installers.yml join the release here. They carry the binaries of this
      # run (checked), then their digests go into checksums.txt and the file is signed again, so
      # the signature covers every asset the release lists.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist-installers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: binaries
      - name: Check the installers carry the binaries of the release
        run: bash scripts/installer-binaries.sh check binaries/binaries.sha256 dist/artifacts.json
      # The installers of the desktop application (desktop.yml) join the same directory: they are
      # listed in checksums.txt, covered by its signature and attested with the rest. They are not
      # signed with a paid certificate (D-033). The binaries inside were built by desktop.yml from the
      # same tag; the SBOM lists the Go modules of the application (desktop/shell/app).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist-installers
      - name: SBOM of the desktop application
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          syft scan dir:desktop/shell/app --source-name stuarty-desktop --source-version "${TAG#v}" \
            -o "spdx-json=dist-installers/stuarty-desktop_${TAG#v}.sbom.json"
      - name: Attach the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The Debian packages of the server are already in checksums.txt; the other kinds, the desktop
          # installers and the desktop SBOM are added here.
          ls -l dist-installers
          (cd dist-installers && sha256sum -- *) >>dist/checksums.txt
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          gh release upload "$TAG" dist-installers/* dist/checksums.txt dist/checksums.txt.sigstore.json --clobber --repo "$GITHUB_REPOSITORY"
      - name: Verify the checksums signature
        run: |
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: ./dist/checksums.txt
      # Also attach the provenance bundle to the release, so tools that read
      # release assets (OpenSSF Scorecard) see it next to the archives.
      - name: Upload the provenance bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cp "$BUNDLE" stuarty.intoto.jsonl
          gh release upload "$TAG" stuarty.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"
      # 6 archives + 6 SBOMs + 2 .deb + the Windows, AppImage and 2 macOS installers
      # + the desktop Windows installer, .deb and 2 .dmg + the desktop SBOM
      # + the 3 launcher artifacts of the desktop application (the AppImage and 2 zipped .app)
      # + checksums.txt + its bundle + the provenance. A stable release adds feed.json (job feed).
      - name: Check the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets | length")"
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq ".body | length")"
          echo "assets=$count body_length=$body"
          [ "$count" -eq 29 ] && [ "$body" -gt 0 ]

  # The feed of the desktop auto-update (SDD-009 section 10.5, P3-REL-004). Stable tags only: a pre-release
  # never reaches it. The installers are the ones the release lists, so every digest of the feed is one
  # of checksums.txt, which the next step proves before the feed is attached.
  feed:
    needs: [tag, goreleaser]
    if: needs.goreleaser.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach feed.json to the release
    env:
      TAG: ${{ needs.goreleaser.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://video.vukem.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.goreleaser.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-installers
      # The installers are served from Pages, next to the feed, not from the release: a release asset
      # URL redirects to another host, and the client follows no redirect and talks to one host only.
      - name: Sign the feed
        env:
          UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
        run: |
          set -euo pipefail
          ls -l desktop-installers
          # The notes of the feed are the bullets of the release body (a short summary, the tool bounds it).
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          bash scripts/update-feed.sh sign "${TAG#v}" "${SITE_URL%/}/updates" desktop-installers feed.json release-notes.md
      - name: The feed equals checksums.txt and verifies with the public key
        env:
          PUBLIC_KEY: ${{ vars.UPDATE_FEED_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p checksums.txt
          bash scripts/update-feed.sh verify "$PUBLIC_KEY" checksums.txt feed.json
      - name: Attach the feed
        run: |
          set -euo pipefail
          gh release upload "$TAG" feed.json --clobber --repo "$GITHUB_REPOSITORY"
          count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets | length")"
          echo "assets=$count"
          [ "$count" -eq 30 ]

  # Publishes the feed and the installers it lists on GitHub Pages: site.yml adds the latest stable
  # release to the site it deploys (scripts/pages-updates.sh), so a docs-only deploy keeps them too.
  pages:
    needs: feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start site.yml
    steps:
      - name: Run the site workflow on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  # The supply-chain audit of what was published (SDD-009 section 20 item 20): licences, notices in every
  # installer, archive size. It reads the release back from GitHub, so it also proves the uploaded files.
  audit:
    needs: [goreleaser, image]
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' && needs.image.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ needs.goreleaser.outputs.tag }}
      STABLE: ${{ needs.goreleaser.outputs.stable }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.goreleaser.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # innoextract opens the Inno Setup installers, which 7z cannot; 7z is on the runner image.
      - name: Install innoextract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends innoextract
      - name: Audit the release
        run: |
          flags=""
          [ "$STABLE" = "true" ] || flags="--no-image"
          bash scripts/release-audit.sh "$TAG" $flags

  image:
    needs: goreleaser
    if: needs.goreleaser.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GHCR_IMAGE: ghcr.io/alexgalhardo/stuarty
      HUB_IMAGE: alexgalhardo/stuarty
      TAG: ${{ needs.goreleaser.outputs.tag }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestation of the image
    steps:
      - name: Check the Docker Hub credentials
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$HUB_USER" ] || [ -z "$HUB_TOKEN" ]; then
            echo "::error::add the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN (see SDD-009 section 16)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the image tags
        id: meta
        run: |
          version="${TAG#v}"
          # latest moves only for the highest stable tag of the repository: a run of an
          # older tag (a workflow_dispatch re-run of v0.18.0 after v0.20.0 did this on
          # 2026-11-16) must not take latest back.
          highest="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*'             | sed 's#.*refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          echo "highest stable tag: v${highest}, this run: v${version}"
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              echo "$image:$version"
              echo "$image:${version%.*}"
              if [ "$version" = "$highest" ]; then
                echo "$image:latest"
              fi
            done
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build and test the amd64 image locally first (load: true); nothing is
      # pushed, and so latest does not move, until the smoke test passes.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .config/docker/stuarty.Dockerfile
          platforms: linux/amd64
          load: true
          tags: stuarty:release-smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
      - name: Smoke test the image before publishing
        run: bash scripts/image-smoke.sh stuarty:release-smoke ${{ steps.meta.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: .config/docker/stuarty.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the image digest in both registries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexgalhardo/stuarty
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/alexgalhardo/stuarty
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify the signatures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            cosign verify "$image@$DIGEST" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
