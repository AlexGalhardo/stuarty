name: PR title

# The title is the summary of the branch. Pull requests are rebase-merged
# (ADR-0028), so every commit reaches main as it is and is checked too.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            core
            timeline
            schema
            command
            plan
            lint
            engine
            raster
            ingest
            export
            image
            transcribe
            installers
            service
            workspace
            web
            api
            mcp
            cli
            ui
            site
            docs
            repo
            ci
            deps
            deps-dev
            release
            adr
            sdd
            go
            security
            desktop
            http
            ffmpeg
            renderer
            docker
            library
            events
            cmd
            contract
            pathguard
            remote
            timeval
            store
            notices
            projects
            preview
            owner
            e2e
            upgrade
            servicetest
            auth
            studio
            prd
          requireScope: false
          subjectPattern: ^[^A-Z].*[^.]$
          subjectPatternError: Description must start lowercase and must not end with a period.

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Same rules as the title (SDD-009 section 6.1 and 6.2): an allowed type,
      # an optional allowed scope, "!" for a breaking change, a description that
      # starts in lower case and does not end with a period, a header of at most
      # 100 characters. A "Revert" subject made by git, a merge commit and a
      # GitHub code-scanning autofix ("Potential fix for ...", committed from the
      # pull request page) are skipped; a fixup! or squash! commit is not,
      # because rebase-merge would put it on main.
      - name: Every commit is a Conventional Commit with an allowed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          scopes='core|timeline|schema|command|plan|lint|engine|raster|ingest|export|image|transcribe|installers|service|workspace|web|api|mcp|cli|ui|site|docs|repo|ci|deps|deps-dev|release|adr|sdd|sdd-[0-9]{3}|go|security|desktop|http|ffmpeg|renderer|docker|library|events|cmd|contract|pathguard|remote|timeval|store|notices|projects|preview|owner|e2e|upgrade|servicetest|auth|studio|prd'
          pattern="^(${types})(\((${scopes})\))?!?: [^A-Z ].*[^. ]$|^(${types})(\((${scopes})\))?!?: [^A-Z ]$"
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            case "$subject" in
              Merge\ *|Revert\ \"*|Potential\ fix\ for\ *) continue ;;
            esac
            # Commits already pushed with a header over 100 characters; a pushed
            # commit cannot be reworded without a force push (SDD-009 section 6.1).
            case "$sha" in
              0bb53009b47ba105470f7f29b925c0aea18881ff|5144ea0df583ccff7e29724018d552b3cebb713b|c83d5ab77291639e5b320e934a590664fe84b45e|a2d2a6177e62a8c7b41799221e3b7d99202723c0|af3252cc1c4d6e4cca475d2f0248744469bdd6cf|5cf1eba3e81e3a6356011cc2ecaf0e5310dddff2) continue ;;
            esac
            if [ "${#subject}" -gt 100 ] || ! printf '%s\n' "$subject" | grep -qE "$pattern"; then
              echo "::error title=Not a Conventional Commit::${sha:0:9} ${subject}"
              bad=1
            fi
          done < <(git log --format='%H %s' "${BASE_SHA}..${HEAD_SHA}")
          if [ "$bad" -ne 0 ]; then
            echo "Allowed types: ${types//|/, }"
            echo "Allowed scopes: ${scopes//|/, }"
            exit 1
          fi
