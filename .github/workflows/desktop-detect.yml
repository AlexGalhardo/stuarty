name: Desktop detect

# ADR-0023 and SDD-012 section 21.2: runs the feature-detection page of
# desktop/detect in Playwright's WebKit, on Linux (WebKitGTK) and on macOS (the
# WebKit nearest to WKWebView), and keeps each results file as an artifact. The
# verdict is data for the author: a `fail` verdict does not fail the job, only a
# run that cannot finish does. Not a required check.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "web/e2e/**"
      - ".github/workflows/desktop-detect.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  detect:
    name: Detect (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VUKEM_VIDEO_DETECT_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx playwright install --with-deps webkit
        working-directory: web
      # os.tmpdir() reads TMPDIR on Linux and macOS, so the detection server
      # stores its results where the upload step looks.
      - name: Run the detection page in WebKit
        working-directory: web
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/detect-tmp"
          TMPDIR="$RUNNER_TEMP/detect-tmp" bunx playwright test -c e2e/playwright.config.ts --project desktop-detect-webkit
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Detection results (${{ matrix.os }})'
            for f in "$RUNNER_TEMP"/detect-tmp/vukem-video-e2e-detect-results/*.json; do
              [ -e "$f" ] || { echo 'no results file'; break; }
              echo "- $(basename "$f"): verdict $(grep -o '"verdict": *"[a-z]*"' "$f" | head -1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-detect-${{ matrix.os }}
          path: ${{ runner.temp }}/detect-tmp/vukem-video-e2e-detect-results/*.json
          if-no-files-found: warn

  # The shell (Wails v3, ADR-0023) is a module of its own, so no other job
  # builds it. The purego tag lets Linux and macOS targets build with no cgo and
  # no WebKitGTK headers; it needs no secret.
  shell-build:
    name: Shell build (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/shell/app/go.sum
      - name: go vet and go build
        working-directory: desktop/shell/app
        run: |
          go vet -tags purego ./...
          go build -tags purego -o /dev/null ./...
