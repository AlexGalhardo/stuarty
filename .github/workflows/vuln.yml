name: Vulnerabilities (weekly)

# Advisories land after code ships: re-scan weekly even when nothing was
# pushed. The pull request run of govulncheck is the job Vulnerabilities of ci.yml.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: govulncheck (desktop/shell/app)
        working-directory: desktop/shell/app
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  bun-audit:
    name: bun audit (web and site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: bun audit (web)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
      - name: bun audit (site)
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high

  cargo-deny:
    name: cargo deny advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check renderer advisories
        working-directory: renderer
        run: cargo deny check advisories
      - name: Check aihelper advisories
        working-directory: aihelper
        run: cargo deny check advisories
      - name: Check capture advisories
        working-directory: capture
        run: cargo deny check advisories
