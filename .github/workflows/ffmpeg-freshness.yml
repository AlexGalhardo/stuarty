name: FFmpeg freshness

# FFmpeg gets security fixes in patch releases; between one and our pin bump the released builds
# carry the known flaws (SDD-007 section 14 item 12). Every week compare the pinned release with
# the newest patch tag of its branch and check the pin age (SDD-007 section 12). A stale pin opens
# or updates ONE issue labelled ffmpeg-freshness, and a pin older than 90 days also fails the run,
# which ci-failure.yml reports. The decision is made by internal/tools/ffmpegfresh, which reads
# no network: this workflow fetches the tags and hands them over.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: FFmpeg freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check the pin
        id: check
        run: |
          set -euo pipefail
          gh api repos/FFmpeg/FFmpeg/tags --paginate --jq '.[].name' >"$RUNNER_TEMP/tags.txt"
          sources_date="$(git log -1 --format=%cs -- .config/ffmpeg-build/sources.env)"
          go run ./internal/tools/ffmpegfresh \
            -tags "$RUNNER_TEMP/tags.txt" \
            -sources-date "$sources_date" \
            -body "$RUNNER_TEMP/issue.md" \
            -output "$GITHUB_OUTPUT"
      - name: Open or update the issue
        if: steps.check.outputs.stale == 'true'
        run: |
          set -euo pipefail
          title="FFmpeg pin is stale"
          gh label create ffmpeg-freshness --color B60205 --description "The pinned FFmpeg is behind upstream or too old" --force
          gh label create priority:p1 --color b60205 --description "Fix before the next release" --force
          num=$(gh issue list --label ffmpeg-freshness --state open --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --label ffmpeg-freshness --label priority:p1 --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Fail when the pin is too old
        if: steps.check.outputs.too_old == 'true'
        env:
          AGE_DAYS: ${{ steps.check.outputs.age_days }}
        run: |
          echo "::error::the pinned FFmpeg is $AGE_DAYS days old (limit 90)"
          exit 1
