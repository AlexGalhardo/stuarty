name: Fuzz

# Fuzzing campaign of the native Go targets: weekly, and on demand with a
# longer time. Crashers are uploaded as artifacts; commit them under
# testdata/fuzz/<Target>/ as regression seeds together with the fix. Add a
# line to the matrix when a package gets a Fuzz target (SDD-007 section 12
# lists the ones planned).
on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration per target (go test -fuzztime)
        default: 30s
      long_fuzztime:
        description: Duration per target of the three-system campaign (FuzzApplyBatch, FuzzSniffMedia, FuzzFFArgsCheck, FuzzFontHeader)
        default: 30m

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }} (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./core/timeval, target: FuzzParse }
          - { pkg: ./engine/raster, target: FuzzFontHeader }
          - { pkg: ./service, target: FuzzTemplateArchive }
          - { pkg: ./web/app/servicetest, target: FuzzBundleArchive }
          - { pkg: ./service/pathguard, target: FuzzCanonicalizeImportPath }
          - { pkg: ./service/untrusted, target: FuzzUntrustedClean }
          - { pkg: ./core/otio, target: FuzzImport }
          - { pkg: ./web/app/http, target: FuzzHostCheck }
    env:
      FUZZTIME: ${{ inputs.fuzztime || '30s' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZTIME"
      # upload-artifact rejects "." segments, so normalise the corpus path first.
      - name: Locate crashers
        id: corpus
        if: failure()
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: echo "dir=$(realpath -m --relative-to="$GITHUB_WORKSPACE" "$PKG/testdata/fuzz/$TARGET")" >> "$GITHUB_OUTPUT"
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashers-${{ matrix.target }}
          path: ${{ steps.corpus.outputs.dir }}/
          if-no-files-found: ignore

  # The campaign of P4-ENG-001 and P4-RND-002: 30 minutes per target on each operating system, with the
  # whole registry and the whole hostile corpus. The job budget is the fuzz time plus the build.
  fuzz-long:
    name: ${{ matrix.target }} (${{ matrix.os }}, long)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # target is a dimension, so every target runs on every system; include only adds its
        # package. An include entry with a key that is not a dimension would overwrite the one
        # before it and leave a single target.
        target: [FuzzApplyBatch, FuzzSniffMedia, FuzzFFArgsCheck, FuzzFontHeader]
        include:
          - { target: FuzzApplyBatch, pkg: ./core/command }
          - { target: FuzzSniffMedia, pkg: ./engine/ffmpeg }
          - { target: FuzzFFArgsCheck, pkg: ./engine/ffmpeg }
          - { target: FuzzFontHeader, pkg: ./engine/raster }
    env:
      LONG_FUZZTIME: ${{ inputs.long_fuzztime || '30m' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -fuzz
        env:
          PKG: ${{ matrix.pkg }}
          TARGET: ${{ matrix.target }}
        run: go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$LONG_FUZZTIME"
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashers-${{ matrix.target }}-${{ matrix.os }}
          path: |
            core/command/testdata/fuzz/${{ matrix.target }}/
            engine/ffmpeg/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
