name: Site

# Every pull request that touches the site builds the static export and runs its
# checks; a push to main publishes it to GitHub Pages (source "GitHub Actions").
# Free tier only: no server, no paid service (D-015, D-028).
#
# The deployed site also carries /updates/: the signed feed of the desktop auto-update and the installers it
# lists, copied from the latest stable release by scripts/update-feed.sh (SDD-009 section 10.5, D-033). They
# must be here, not on the release page, because the client follows no redirect and talks to one host only.
# release.yml runs this workflow on main after it attaches the feed; every other deploy keeps them.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "core/schema/**"
      - "web/app/cli/**"
      - "internal/tools/clidoc/**"
      - "docs/sdds/000-shared-definitions.md"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
      - "scripts/update-feed.sh"
  pull_request:
    paths:
      - "site/**"
      - "core/schema/**"
      - "web/app/cli/**"
      - "internal/tools/clidoc/**"
      - "docs/sdds/000-shared-definitions.md"
      - "CHANGELOG.md"
      - ".github/workflows/site.yml"
      - "scripts/update-feed.sh"
  # The release train dispatches this workflow on main after it publishes a release (release-train.sh), so
  # the landing download buttons read the new release at build time.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # upload-pages-artifact writes the special Pages artifact.
      actions: write
      pages: write
    defaults:
      run:
        working-directory: site
    env:
      # Optional repository variable; the default is the custom domain https://stuarty.com, served by
      # GitHub Pages with base path / (SDD-010 section 12.4). The domain itself is a repository Pages setting.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Tests that import the site's own modules need its dependencies;
      # test:scripts stays dependency-free for the Last updated job.
      - run: npm run test:site
      - run: npm run lint
      - run: npm run check:mdx
      # The reference is generated from the registry, the schemas and the CLI of the binary:
      # a change that is not regenerated fails here (SDD-010 section 8).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm run reference:check
      - run: npm run build
        env:
          # site/lib/releases.ts reads the latest release; the token only raises the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:built
      - name: Add the desktop update feed and its installers
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-feed.sh pages site/out
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  # Every docs page must ship a "Last updated" date (site/README.md); dates come
  # from git, so full history.
  last-updated:
    name: Last updated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run test:scripts
      - run: npm run check:last-updated

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, last-updated]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
