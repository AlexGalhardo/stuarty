name: Docs last updated

# site.yml only runs when site files change. This one runs on every pull
# request and every push to main, so a page left out of last-updated.json
# cannot stay hidden until the next docs edit (SDD-009 section 9.6).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  last-updated:
    name: Docs last updated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun run test:scripts
      - run: bun run check:last-updated
