name: Helpers

# Builds the whisper.cpp helper for the platforms where upstream ships no
# prebuilt whisper-cli (SDD-011 section 10.2: darwin-amd64, darwin-arm64 and
# windows-arm64; linux-amd64, linux-arm64 and windows-amd64 come from upstream),
# from the source pinned in .config/whisper.env, with the options of
# scripts/whisper-build.sh (CPU only, no GPL component). Each helper must
# transcribe real speech on its own runner before it is published as an asset of
# the release helpers-<whisper tag>, with a SHA-256, a cosign keyless signature
# and a provenance attestation. On demand, and when the pin changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".config/whisper.env"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, os_name: darwin, arch: arm64 }
          - { runner: macos-15-intel, os_name: darwin, arch: amd64 }
          - { runner: windows-11-arm, os_name: windows, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build whisper-cli
        id: build
        shell: bash
        run: |
          archive="$(bash scripts/whisper-build.sh "${{ matrix.os_name }}" "${{ matrix.arch }}" out)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -l out
      - name: It transcribes 20 s of speech (30 words or more)
        shell: bash
        run: bash scripts/whisper-test.sh "${{ steps.build.outputs.archive }}" "$RUNNER_TEMP/whisper-test"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-${{ matrix.os_name }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish the helpers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC identity for cosign and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: helper-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Every archive matches its SHA-256 and is signed
        run: |
          cd dist
          for f in whisper-cli-*.tar.gz whisper-cli-*.zip; do
            [ -e "$f" ] || continue
            sha256sum -c "$f.sha256"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/whisper-cli-*.tar.gz
            dist/whisper-cli-*.zip
      - name: Verify the signatures with the workflow identity
        run: |
          cd dist
          for f in whisper-cli-*.tar.gz whisper-cli-*.zip; do
            [ -e "$f" ] || continue
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/helpers.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Publish the release helpers-<tag>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .config/whisper.env
          tag="helpers-${WHISPER_TAG}"
          {
            echo "whisper-cli ${WHISPER_TAG} (${WHISPER_COMMIT}) built from the pinned source for the platforms upstream does not ship."
            echo
            echo "CPU only, no GPL component; options in scripts/whisper-build.sh. SHA-256:"
            echo
            echo '```'
            (cd dist && cat whisper-cli-*.sha256)
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$tag" dist/whisper-cli-* --clobber
