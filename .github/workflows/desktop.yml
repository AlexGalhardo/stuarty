name: desktop

# Builds and tests the installers of the desktop application (SDD-009 sections 10.4 and 10.5, P3-REL-003,
# D-033): the Windows setup .exe (Inno Setup), the Debian package (dpkg-deb) and a macOS disk image per
# architecture (hdiutil). The launcher updates itself from three more files, listed in the feed under
# "launchers" (SDD-009 section 10.5 item 6): the AppImage (appimagetool, pinned by version and SHA-256 in
# .config/installers/tools.env) and one zip per macOS architecture that holds Vukem Video.app. Each holds the native window (desktop/shell/app, Wails) and the server it starts.
# None is signed with a paid certificate (D-033): the release lists their SHA-256 in checksums.txt, signs
# that file with cosign and attests every file. The windows and the server are installed or mounted and
# checked, but not started: a runner has no screen.
#
# It is called by release.yml with the tag to build, and runs on its own for a pull request that touches
# the desktop application or its packaging, and on demand. When the repository variable
# UPDATE_FEED_PUBLIC_KEY is set the application is built with the public key and the feed URL of its
# update client; without it the update menu says the build has no feed (SDD-009 section 10.5).
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build, for example refs/tags/v0.16.0"
        required: true
        type: string
      version:
        description: "Version of the installers, for example 0.16.0"
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
      - "web/cmd/app/**"
      - ".config/goreleaser.yaml"
      - "scripts/installer-binaries.sh"

permissions:
  contents: read

env:
  # A pull request or a manual run builds a snapshot; the release passes the tag.
  VERSION: ${{ inputs.version || '0.0.0-snapshot' }}
  SNAPSHOT: ${{ inputs.ref == '' && '--snapshot' || '' }}
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_FEED_PUBLIC_KEY }}
  # The feed is served by GitHub Pages, from the same host as the installers it lists (the client follows
  # no redirect and talks to one host only; SDD-009 section 10.5).
  UPDATE_FEED_URL: ${{ vars.SITE_URL || 'https://video.vukem.dev' }}/updates/feed.json

jobs:
  # In a release the binaries come from installers.yml, which release.yml runs first and which uploads the
  # artifact "binaries" in the same run. On its own, this workflow builds them.
  binaries:
    name: Binaries
    if: inputs.ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install the web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2"
          args: build --clean ${{ env.SNAPSHOT }}
      - name: Collect the binaries
        run: bash scripts/installer-binaries.sh flatten dist/artifacts.json bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: bin
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: binaries
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: binaries
      - name: Build the application
        shell: bash
        run: |
          set -euo pipefail
          flags="-s -w -H windowsgui -X main.version=${VERSION}"
          if [ -n "$UPDATE_PUBLIC_KEY" ]; then
            flags="$flags -X github.com/AlexGalhardo/vukem-video/desktop/update.FeedURL=${UPDATE_FEED_URL} -X github.com/AlexGalhardo/vukem-video/desktop/update.PublicKeyHex=${UPDATE_PUBLIC_KEY}"
          fi
          mkdir -p out
          (cd desktop/shell/app && go build -trimpath -ldflags "$flags" -o "../../../out/vukem-video-desktop.exe" .)
      - name: Build the installer
        shell: bash
        run: |
          iscc="$(bash scripts/fetch-installer-tool.sh inno)"
          MSYS2_ARG_CONV_EXCL='*' "$iscc" "/DAppVersion=${VERSION}" "/DFileVersion=${VERSION//./-}" \
            "/DDesktopBinary=$(cygpath -w "$PWD/out/vukem-video-desktop.exe")" \
            "/DServerBinary=$(cygpath -w "$PWD/binaries/windows_amd64/vukem-video.exe")" \
            "/DOutputDir=$(cygpath -w "$PWD/installer")" \
            desktop/packaging/windows/vukem-video-desktop.iss
          ls -l installer
      - name: Test the installer
        shell: pwsh
        run: ./desktop/packaging/windows/smoke-test.ps1 -Installer (Get-ChildItem installer/vukem-video-desktop-*.exe).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: installer/vukem-video-desktop-*.exe
          if-no-files-found: error

  linux:
    name: Debian package and AppImage
    needs: binaries
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: binaries
      # purego: no cgo and no GTK or WebKitGTK headers at build time; the window loads them at run time.
      - name: Build the application
        run: |
          set -euo pipefail
          flags="-s -w -X main.version=${VERSION}"
          if [ -n "$UPDATE_PUBLIC_KEY" ]; then
            flags="$flags -X github.com/AlexGalhardo/vukem-video/desktop/update.FeedURL=${UPDATE_FEED_URL} -X github.com/AlexGalhardo/vukem-video/desktop/update.PublicKeyHex=${UPDATE_PUBLIC_KEY}"
          fi
          mkdir -p out
          (cd desktop/shell/app && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags purego -trimpath -ldflags "$flags" -o "../../../out/vukem-video-desktop" .)
      - name: Build the package
        run: |
          chmod +x binaries/linux_amd64/vukem-video
          bash desktop/packaging/linux/build-deb.sh out/vukem-video-desktop binaries/linux_amd64/vukem-video "$VERSION" package
      - name: Test the package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          bash desktop/packaging/linux/smoke-test.sh package/*.deb
      # The AppImage is what the launcher installs updates from on Linux. appimagetool is the pinned
      # version of .config/installers/tools.env, downloaded by exact URL and checked by SHA-256 before use.
      - name: Build the AppImage
        run: bash desktop/packaging/linux/build-appimage.sh out/vukem-video-desktop binaries/linux_amd64/vukem-video "$VERSION" package
      # Runners have no FUSE and no screen: the AppImage is extracted, not run.
      - name: Check the AppImage
        run: |
          set -euo pipefail
          appimage="$(ls package/vukem-video-desktop-*.AppImage)"
          chmod +x "$appimage"
          dir="$(mktemp -d)"
          (cd "$dir" && APPIMAGE_EXTRACT_AND_RUN=1 "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          test -x "$dir/squashfs-root/usr/bin/vukem-video-desktop"
          test -x "$dir/squashfs-root/usr/bin/vukem-video"
          "$dir/squashfs-root/usr/bin/vukem-video" version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: |
            package/*.deb
            package/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS disk image and app zip (${{ matrix.arch }})
    needs: binaries
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: binaries
      # purego: no cgo, so one Apple silicon runner builds both architectures.
      - name: Build the application
        run: |
          set -euo pipefail
          flags="-s -w -X main.version=${VERSION}"
          if [ -n "$UPDATE_PUBLIC_KEY" ]; then
            flags="$flags -X github.com/AlexGalhardo/vukem-video/desktop/update.FeedURL=${UPDATE_FEED_URL} -X github.com/AlexGalhardo/vukem-video/desktop/update.PublicKeyHex=${UPDATE_PUBLIC_KEY}"
          fi
          mkdir -p out
          (cd desktop/shell/app && CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.arch }} go build -tags purego -trimpath -ldflags "$flags" -o "../../../out/vukem-video-desktop" .)
      - name: Build the disk image
        run: |
          chmod +x binaries/darwin_${{ matrix.arch }}/vukem-video
          bash desktop/packaging/macos/build-dmg.sh out/vukem-video-desktop binaries/darwin_${{ matrix.arch }}/vukem-video "$VERSION" ${{ matrix.arch }} image
      # macos-latest is an Apple silicon machine: only the arm64 image is mounted and its server run here.
      - name: Test the disk image
        if: matrix.arch == 'arm64'
        run: bash desktop/packaging/macos/smoke-test.sh image/*-arm64.dmg
      # The launcher refuses a zip that does not hold exactly one Vukem Video.app (SDD-009 section 10.5).
      - name: Check the app zip
        run: |
          set -euo pipefail
          zip="$(ls image/vukem-video-desktop_*_darwin_${{ matrix.arch }}.app.zip)"
          tops="$(unzip -Z1 "$zip" | cut -d/ -f1 | sort -u)"
          [ "$tops" = "Vukem Video.app" ] || { echo "::error::the zip holds: $tops"; exit 1; }
          unzip -Z1 "$zip" | grep -qx 'Vukem Video.app/Contents/MacOS/vukem-video-desktop'
          unzip -Z1 "$zip" | grep -qx 'Vukem Video.app/Contents/MacOS/vukem-video'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            image/*.dmg
            image/*.app.zip
          if-no-files-found: error
