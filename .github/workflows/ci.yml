name: CI

# Pull-request checks of SDD-009 section 9.4 and 13. This file holds the jobs
# whose tools exist today; the jobs that need tools of later tasks (security
# suites, fuzz, no egress, the contract and OpenAPI jobs) are added by those
# tasks, each with the display name the ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TASK_VERSION: v3.54.0
  GOLANGCI_LINT_VERSION: v2.15.0
  BUN_VERSION: 1.4.4
  CARGO_DENY_VERSION: 0.20.2

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      # The action only installs the binary; Taskfile.yml runs it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: task lint:go
        run: task lint:go
      - name: task vet
        run: task vet
      - name: task tidy:check
        run: task tidy:check
      - name: go fix (modernizers)
        run: |
          go fix -diff ./... > fix.diff || true
          if [ -s fix.diff ]; then echo "::warning::go fix suggests changes"; cat fix.diff; fi
      # Decreasing budget: the job fails when a new //nolint:gocognit appears.
      - name: gocognit suppression budget
        env:
          GOCOGNIT_BUDGET: "0"
        run: |
          n=$(grep -rn --include='*.go' --exclude='*_test.go' 'nolint:gocognit' . | wc -l)
          echo "nolint:gocognit in non-test code: $n (budget $GOCOGNIT_BUDGET)"
          if [ "$n" -gt "$GOCOGNIT_BUDGET" ]; then
            echo "::error title=gocognit budget::$n suppressions, budget $GOCOGNIT_BUDGET; split the function instead of adding //nolint:gocognit"
            exit 1
          fi

  lint-markdown:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      # Runs markdownlint-cli2 0.24.1 through bunx, the same as a developer.
      - name: task lint:md
        run: task lint:md

  web:
    name: Types and lint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:contrast
      - run: bun run check:i18n
      # `bun run test` is added with the unit test runner, which needs the
      # author's approval (SDD-012 section 3.1).

  # The Go suite runs in five shards per operating system, in parallel, each inside
  # the 20 minute budget of SDD-009 section 13.4: the export tests (engine/export,
  # which alone took 19 minutes without the race detector on a loaded machine) in
  # three shards by test name, the rest of engine/, and everything else. Together
  # they cover `./...`. The
  # `Test (<os>)` job below keeps the name the ruleset requires, merges the
  # coverage profiles and runs the gate.
  test-shard:
    name: Go tests (${{ matrix.shard }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [export-1, export-2, export-3, engine, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # golang/go#81238 corrupts the heap on Intel AMX hosts: the CPU tells a
      # runtime crash of that bug from a real one.
      - name: Runner CPU
        if: runner.os == 'Windows'
        run: (Get-CimInstance Win32_Processor).Name
      # The pinned LGPL FFmpeg (.config/ffmpeg.env) on Linux and Windows. macOS has
      # no BtbN build: the script installs Homebrew's, which is GPL, so the tests
      # that need the pinned build skip there with a message (risk R6).
      - name: Install FFmpeg
        shell: bash
        run: |
          bin_dir="$(bash scripts/install-ffmpeg.sh)"
          echo "VUKEM_VIDEO_TEST_FFMPEG_DIR=${bin_dir}" >> "$GITHUB_ENV"
      - name: go test
        shell: bash # PowerShell would split -coverprofile=coverage.out at the dot
        # -coverpkg=./... credits a package with what the tests of the others
        # execute: the wiring packages of web/ (bootstrap, routes, seeders) are
        # exercised by web/tests, not by tests of their own. The profiles of the
        # shards are merged before the gate (a block counts as covered when any
        # shard hit it).
        run: |
          case "$SHARD" in
            export-*)
              # Every third test of engine/export (sorted), shard k of 3. Without -race:
              # under the race detector a third of these frame-composing tests ran past
              # 17 min (run 43924786343), and the race scope of the project is core,
              # service and web/app (task test:race); -covermode=atomic keeps the
              # profiles mergeable with the race shards.
              names="$(go test -list '^Test' ./engine/export/ | grep '^Test' | awk -v k="${SHARD#export-}" 'NR % 3 == k % 3' | paste -sd'|' -)"
              go test -count=1 -timeout=17m -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -run "^(${names})"'$' ./engine/export/
              exit
              ;;
            engine) pkgs="$(go list ./engine/... | grep -vE '/engine/export$')" ;;
            rest) pkgs="$(go list ./... | grep -vE '/engine(/|$)')" ;;
          esac
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout=17m -coverpkg=./... -coverprofile=coverage.out $pkgs
      # SDD-004 section 12: the common-case export must run at 1.5 x real time or
      # better. Benchmarks do not run under go test, and the race detector skips this
      # one, so it has a step of its own, on the three runners, with the pinned FFmpeg
      # (it skips with a message where only a GPL build exists, risk R6). The numbers
      # are in the log and in the job summary.
      - name: Export benchmark (BenchmarkExportCommonCase)
        if: matrix.shard == 'export-1'
        shell: bash
        env:
          VUKEM_VIDEO_BENCH_MIN_RT: "1.5"
        run: |
          go test -run '^$' -bench BenchmarkExportCommonCase -benchtime=1x -count=1 -timeout=10m ./engine/export/ | tee bench.txt
          { echo '### BenchmarkExportCommonCase (${{ matrix.os }})'; echo '```'; grep -E "^Benchmark|x real time" bench.txt || echo "skipped: no pinned LGPL FFmpeg on this runner"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Only Linux feeds the coverage gate (see the Test job).
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage.out

  # The required checks of the ruleset (`Test (ubuntu-latest)` and the other two).
  # Each one fails when a shard of its own operating system failed or did not
  # run (a skipped job would otherwise count as a pass), and the Linux one merges
  # the shard profiles and runs the coverage gate: Linux and Windows have the
  # pinned LGPL FFmpeg, but only Linux gates. macOS has none (risk R6, SDD-009
  # section 13.3), so the FFmpeg tests skip there and its coverage cannot reach
  # the floors; it runs go test but not the gate.
  test:
    name: Test (${{ matrix.os }})
    needs: test-shard
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: The shards of ${{ matrix.os }} passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_OS_NAME: ${{ matrix.os }}
        run: |
          jobs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq ".jobs[] | select(.name | startswith(\"Go tests (\") and endswith(\", ${RUNNER_OS_NAME})\")) | .name + \" \" + (.conclusion // \"running\")")"
          echo "$jobs"
          test "$(printf '%s\n' "$jobs" | grep -c .)" -eq 5
          if printf '%s\n' "$jobs" | grep -qv ' success$'; then
            echo "::error::a Go test shard of ${RUNNER_OS_NAME} did not pass"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.os == 'ubuntu-latest'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          pattern: coverage-*
          path: shards
      - name: Merge the coverage profiles
        if: matrix.os == 'ubuntu-latest'
        run: |
          { echo "mode: atomic"; grep -hv '^mode:' shards/*/coverage.out; } > coverage.out
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: go run ./internal/tools/covergate -v coverage.out
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  # P1-QA-001, Prototype exit criteria 1 and 2: the reference scenario driven by the
  # CLI process, MCP over stdio and MCP over HTTP against a real `serve`, each
  # export verified with ffprobe (SDD-004 section 8), the three documents compared
  # (NFR-025). The browser driver is the `browser` job. Where only a GPL FFmpeg
  # exists (macOS, risk R6) the tests skip with a message, so the job still
  # passes there and the summary says what ran.
  reference:
    name: Reference scenario (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install FFmpeg
        shell: bash
        run: |
          bin_dir="$(bash scripts/install-ffmpeg.sh)"
          echo "VUKEM_VIDEO_TEST_FFMPEG_DIR=${bin_dir}" >> "$GITHUB_ENV"
      - name: Reference scenario through the CLI and MCP
        shell: bash
        run: |
          go test -count=1 -timeout=12m -v -run 'TestReferenceScenarioThroughTheRealServer|TestScenarioThroughTheRealServer' ./web/contract/ | tee reference.txt
          { echo '### Reference scenario (${{ matrix.os }})'; echo '```'; grep -E "^(--- |ok|FAIL|PASS)|SKIP" reference.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ADR-0014 item 2 and ADR-0024: the committed contracts and generated
  # references are what the generators write. A generated folder edited by hand,
  # or a generator that was not run, fails here and passes after task codegen.
  generated:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - run: bun install --frozen-lockfile --cwd web
      - run: task codegen
      # Only the folders that exist; site/generated and site/content/generated join
      # when the site generators (SDD-010) do.
      - name: The generated folders are unchanged
        run: |
          paths=()
          for d in core/schema web/resources/js/generated site/generated site/content/generated internal/ffmpegpins; do
            if [ -e "$d" ]; then paths+=("$d"); fi
          done
          git status --short -- "${paths[@]}"
          git diff --exit-code -- "${paths[@]}"
          test -z "$(git status --porcelain -- "${paths[@]}")"

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install FFmpeg
        run: |
          bin_dir="$(bash scripts/install-ffmpeg.sh)"
          echo "VUKEM_VIDEO_TEST_FFMPEG_DIR=${bin_dir}" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      # The projects that need only Chromium; firefox and webkit have their own jobs below.
      - run: bun run e2e -- --project=chromium --project=failing-encoder --project=desktop-detect
        working-directory: web
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-chromium
          path: web/e2e/test-results/
          if-no-files-found: ignore

  # SDD-012 section 21.1, ADR-0023 item 5: every spec not tagged CHROMIUM_ONLY runs on Firefox and on
  # WebKit, in parallel with the Chromium job (P3-REL-005). The browser is the one of the pinned
  # @playwright/test version, installed from the lockfile.
  browser-engines:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install FFmpeg
        run: |
          bin_dir="$(bash scripts/install-ffmpeg.sh)"
          echo "VUKEM_VIDEO_TEST_FFMPEG_DIR=${bin_dir}" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build:e2e
        working-directory: web
      - run: bunx playwright install --with-deps "$BROWSER"
        working-directory: web
        env:
          BROWSER: ${{ matrix.browser }}
      - run: bunx playwright test -c e2e/playwright.config.ts --project="$BROWSER"
        working-directory: web
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: web/e2e/test-results/
          if-no-files-found: ignore

  # BETA exit criterion 5 (P3-REL-005): a project exported on one operating system opens on the other
  # two with the same canonical document and the same media. The first job makes the bundle of the
  # reference project on each system; the second imports the two made elsewhere (and the own) and
  # compares the hashes, so six cross imports and three local ones.
  bundle-export:
    name: Bundle export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The script adds the folder to GITHUB_PATH, so the next steps find ffmpeg and ffprobe.
      - name: Install FFmpeg
        shell: bash
        run: bash scripts/install-ffmpeg.sh
      - name: Export the reference project
        shell: bash
        run: bash scripts/bundle-matrix.sh export "$RUNNER_TEMP/bundle-${{ runner.os }}.vvbundle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ runner.os }}
          path: ${{ runner.temp }}/bundle-${{ runner.os }}.vvbundle
          if-no-files-found: error

  bundle-matrix:
    name: Bundle matrix (${{ matrix.os }})
    needs: bundle-export
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install FFmpeg
        shell: bash
        run: bash scripts/install-ffmpeg.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/bundles
          merge-multiple: true
      - name: Import the bundles made on the three systems
        shell: bash
        run: |
          ls -l "$RUNNER_TEMP/bundles"
          test "$(ls "$RUNNER_TEMP"/bundles/*.vvbundle | wc -l)" -eq 3
          bash scripts/bundle-matrix.sh verify "$RUNNER_TEMP"/bundles/*.vvbundle

  snapshot:
    name: Release build (snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - run: bun install --frozen-lockfile --cwd web
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2"
          args: release --snapshot --clean --skip=sign,publish --config .config/goreleaser.yaml
      # NFR-041: the archive of every platform, without FFmpeg, is under 60 MB (60,000,000 bytes).
      - name: Every archive is under 60 MB
        run: |
          count=0
          for f in dist/vukem-video_*.tar.gz dist/vukem-video_*.zip; do
            size="$(stat -c %s "$f")"
            echo "$f $size"
            [ "$size" -lt 60000000 ] || { echo "::error::$f is $size bytes"; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -eq 6 ] || { echo "::error::expected 6 archives, found $count"; exit 1; }

  # SDD-007 section 12 and SDD-009 section 9.4 job 17: the sandbox tests run for
  # real. A skipped test would pass silently, so the output is checked for PASS.
  bwrap:
    name: Sandbox (bwrap)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 restricts unprivileged user namespaces, which bwrap needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # TestSecurity_T16_LimitsDoNotBreakGoldenExport exports with the pinned build.
      - name: Install FFmpeg
        shell: bash
        run: |
          bin_dir="$(bash scripts/install-ffmpeg.sh)"
          echo "VUKEM_VIDEO_TEST_FFMPEG_DIR=${bin_dir}" >> "$GITHUB_ENV"
      - name: TestSecurity_T16_
        run: |
          go test -count=1 -v -run 'TestSecurity_T16_' ./engine/... | tee t16.log
          if grep -E -- "--- SKIP: TestSecurity_T16_" t16.log; then
            echo "::error::a sandbox test was skipped"
            exit 1
          fi
          grep -q -- "--- PASS: TestSecurity_T16_" t16.log
          # The test of P2-RND-005 must have run, not been skipped, once it exists.
          if grep -rq "func TestSecurity_T16_BwrapHasNoNetwork" engine; then
            grep -q -- "--- PASS: TestSecurity_T16_BwrapHasNoNetwork" t16.log
          fi

  # SDD-004 section 11: the golden cases with the FFmpeg of the distribution
  # instead of the pinned one. Reported, not blocking.
  golden:
    name: Golden cases (PATH FFmpeg)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: VUKEM_VIDEO_FFMPEG="$(command -v ffmpeg)" go test -count=1 -v -run Golden ./engine/export/...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # SDD-009 section 12.3: the committed notices are what the generator writes, and
  # every dependency licence is on the allow-list (NFR-043). The step "Notices are
  # current" of release.yml, which stops a release from stale notices, joins with
  # P2-REL-003.
  notices:
    name: Notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --cwd web
      - run: go run ./internal/tools/notices -check

  # SDD-007 section 12, SDD-009 job 12: every threat of the table has a test that
  # exists, every TestSecurity_T.. test is named by a row, and every operation of
  # service.Service is in the scope matrix.
  threat-coverage:
    name: Threat coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run ./internal/tools/threatcheck

  # P1-RND-003 (ADR-0012, risk R3): text is drawn from the bundled fonts only. The
  # raster tests run as an unprivileged user with every font directory of the
  # system unreadable and fontconfig pointed at nothing, so a test that reads a
  # system font fails here on the runner that has most of them.
  font-isolation:
    name: Font isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Make the system fonts unreadable
        run: |
          set -euo pipefail
          for dir in /usr/share/fonts /usr/local/share/fonts /usr/share/X11/fonts "$HOME/.fonts" "$HOME/.local/share/fonts"; do
            if [ -d "$dir" ]; then
              sudo chmod -R a-rwx "$dir"
              if ls "$dir" >/dev/null 2>&1; then
                echo "::error::$dir is still readable"
                exit 1
              fi
            fi
          done
          mkdir -p "$RUNNER_TEMP/no-fontconfig"
      - name: Raster tests do not read a system font
        env:
          FONTCONFIG_PATH: ${{ runner.temp }}/no-fontconfig
          FONTCONFIG_FILE: ${{ runner.temp }}/no-fontconfig/none.conf
        run: go test -count=1 ./engine/raster/...

  pins:
    name: Workflow pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # An if block: a bare grep | grep -v pipeline exits 0 on an unpinned
      # line, the inverse of what a check needs.
      - name: Every action is pinned by a full commit SHA with a version comment
        run: |
          if grep -RnE "^[[:space:]]*(- )?uses: [^@ ]+@" .github/workflows | grep -vE "@[0-9a-f]{40} # v[0-9]"; then
            echo "::error::an action is not pinned by a full commit SHA with a version comment"
            exit 1
          fi

  # ADR-0029, rule .agents/rules/rust.md: the Rust gate of renderer/ on one pinned Linux runner, and the
  # WebAssembly module built twice from clean with equal digests and equal to the one embedded in
  # engine/renderhost. The toolchain is the one of rust-toolchain.toml (rustup installs it on the first
  # cargo call). The crate has no wasm-bindgen glue, so no wasm-bindgen-cli is installed.
  renderer:
    name: Renderer (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and tools
        run: |
          rustup show active-toolchain
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - name: cargo fmt --check
        working-directory: renderer
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: renderer
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: renderer
        run: cargo test --locked
      - name: cargo deny check
        working-directory: renderer
        run: cargo deny check
      - name: The WebAssembly module is reproducible and is the embedded one
        run: bash scripts/build-renderer.sh check

  # SDD-007 section 10.2 item 3 (check 25): the real binary and the pinned FFmpeg run a
  # reference session under strace; any socket address that is not loopback fails.
  no-egress:
    name: No egress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y strace
      # install-ffmpeg.sh appends the bin folder to GITHUB_PATH for the next steps.
      - name: Install FFmpeg
        run: bash scripts/install-ffmpeg.sh
      - name: Reference session under strace
        run: bash scripts/no-egress.sh

  # SDD-007 section 12: a pull request that adds a dependency with a high or critical
  # advisory, or a licence outside the allow-list of internal/tools/notices/spdx.go
  # (SDD-009 section 12.2 item 4), fails. Keep the two lists equal.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, BSD-2-Clause, BSD-3-Clause, ISC, Apache-2.0, MPL-2.0, 0BSD, Unlicense, OFL-1.1, LGPL-3.0-or-later, blessing, Zlib, WTFPL
