name: FFmpeg build

# Builds the own LGPL FFmpeg of D-017 and ADR-0011 from the sources pinned in
# .config/ffmpeg-build/sources.env, with the flags of
# .config/ffmpeg-build/configure-flags.txt (no GPL, no nonfree, no OpenH264 linked; a pinned patch loads it at run time
# with dlopen), for the platforms of the shipped artifacts. Every platform is built twice on
# separate runners and the two SHA-256 are compared (the reproducibility assert of
# P3-REL-001). Each build is verified by scripts/ffmpeg-verify.sh on its own platform
# before it is published as an asset of the release ffmpeg-<version>-<n>, with a
# SHA-256, a cosign keyless signature and a provenance attestation, as the helpers
# of helpers.yml. On demand only: a build is a deliberate act (it changes the pin).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release assets (the build is always verified)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flags:
    name: The configure flags are LGPL safe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./internal/tools/ffmpegconf -allow .config/ffmpeg-build/configure-allowlist.txt -flags .config/ffmpeg-build/configure-flags.txt
      - run: go test ./internal/tools/ffmpegconf/...

  build:
    name: Build ${{ matrix.platform.os }}-${{ matrix.platform.arch }} (round ${{ matrix.round }})
    needs: flags
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
        platform:
          - { runner: ubuntu-latest, os: linux, arch: amd64, container: "debian:13.7-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2" }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, container: "debian:13.7-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2" }
          - { runner: ubuntu-latest, os: windows, arch: amd64, container: "" }
          - { runner: macos-latest, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
    runs-on: ${{ matrix.platform.runner }}
    # The Linux binaries run in the runtime image (debian:13.7-slim, glibc 2.41), so they are built
    # in that image: on the runner itself they would need the glibc of the runner (2.43 on
    # ubuntu-latest) and fail with "GLIBC_2.43 not found" in the container image.
    container: ${{ matrix.platform.container }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build tools (Linux, in the Debian container)
        if: matrix.platform.os == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git binutils perl pkg-config nasm autoconf automake libtool cmake zip xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build tools (Windows target, host tools)
        if: matrix.platform.os == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm autoconf automake libtool cmake zip xz-utils
      - name: Build tools (Windows target, cross compiled)
        if: matrix.platform.os == 'windows'
        run: sudo apt-get install -y --no-install-recommends mingw-w64 g++-mingw-w64-x86-64-posix
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm autoconf automake libtool cmake gnu-tar xz
      - name: Build FFmpeg
        id: build
        run: |
          archive="$(bash scripts/ffmpeg-build.sh "${{ matrix.platform.os }}" "${{ matrix.platform.arch }}" out)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -l out
      - name: Verify the archive (not for the Windows target, which a Linux runner cannot run)
        if: matrix.platform.os != 'windows'
        run: bash scripts/ffmpeg-verify.sh archive "${{ steps.build.outputs.archive }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-round${{ matrix.round }}
          path: out/*
          if-no-files-found: error

  verify-windows:
    name: Verify the Windows build
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-windows-amd64-round1
          path: dist
      - name: ffmpeg -version, -buildconf, filters and the linker listing
        shell: bash
        run: bash scripts/ffmpeg-verify.sh archive dist/ffmpeg-*-windows-amd64.zip

  publish:
    name: Compare, sign and publish
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC identity for cosign and the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ffmpeg-*-round*
          path: rounds
      - name: The second build gives the same SHA-256 per platform
        run: |
          status=0
          mkdir -p dist
          {
            echo "| platform | round 1 | round 2 | same |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for d in rounds/*-round1; do
            base="${d#rounds/}"; base="${base%-round1}"
            a="$(cat "$d"/*.sha256 | cut -d ' ' -f 1)"
            b="$(cat "rounds/${base}-round2"/*.sha256 | cut -d ' ' -f 1)"
            same=yes
            [ "$a" = "$b" ] || { same=NO; status=1; }
            echo "| $base | ${a:0:12} | ${b:0:12} | $same |" >> "$GITHUB_STEP_SUMMARY"
            cp "$d"/* dist/
          done
          ls -l dist
          # A difference is listed in the summary; it fails the run so that it is justified before publishing.
          exit "$status"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Every archive matches its SHA-256 and is signed
        run: |
          cd dist
          for f in ffmpeg-*.tar.xz ffmpeg-*.zip; do
            [ -e "$f" ] || continue
            sha256sum -c "$f.sha256"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ffmpeg-*.tar.xz
            dist/ffmpeg-*.zip
      - name: Verify the signatures and the attestations with the workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ffmpeg-verify.sh signatures dist
      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .config/ffmpeg-build/sources.env
          tag="$FFMPEG_BUILD_TAG"
          {
            echo "FFmpeg ${FFMPEG_BUILD_VERSION}, own LGPL build ${tag} (D-017, ADR-0011)."
            echo
            echo "Source: ${FFMPEG_SRC_URL} (SHA-256 ${FFMPEG_SRC_SHA256})"
            echo "Flags: .config/ffmpeg-build/configure-flags.txt at this tag. No GPL, no nonfree, OpenH264 not linked (loaded at run time by the patch ${FFMPEG_PATCH_FILE}, SHA-256 ${FFMPEG_PATCH_SHA256}). Hardware encoders (D-034): NVENC, Quick Sync (libvpl, MIT) and AMF (MIT headers) on Windows and Linux x86_64, VideoToolbox on macOS; the vendor runtimes come with the GPU drivers."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            (cd dist && cat ffmpeg-*.sha256)
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$tag" dist/ffmpeg-* --clobber
