version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Workflows pin actions by commit SHA with a "# vX.Y.Z" comment; Dependabot
  # bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  # web/ has only bun.lock; the bun ecosystem updates it (Dependabot supports
  # the text bun.lock of Bun 1.1.39 and later).
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directory: /desktop/shell/app
    schedule:
      interval: weekly
    groups:
      desktop-go-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /renderer
    schedule:
      interval: weekly
    groups:
      renderer-cargo-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /aihelper
    schedule:
      interval: weekly
    groups:
      aihelper-cargo-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: cargo
    directory: /capture
    schedule:
      interval: weekly
    groups:
      capture-cargo-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /.config/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
