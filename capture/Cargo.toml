[package]
name = "stuarty-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The native screen capture helper of Stuarty (ADR-0049, SDD-025). It captures and writes; it decides nothing about a project."

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

# windows-capture is the one crate ADR-0049 approves for Windows Graphics Capture (D-133). Nothing else is
# approved for this epic: the JSON of the protocol is written by hand in src/json.rs, over std only.
[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
# wasapi is the second approved crate (ADR-0049 item 7): the microphone and the loopback of the system mix.
wasapi = "=0.27.0"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
