# GoReleaser builds the stuarty binaries for a tag and attaches them to
# the GitHub release that release.yml created from CHANGELOG.md (so GoReleaser
# keeps the notes). See docs/sdds/009-releases-and-ci-cd.md section 10.
version: 2

project_name: stuarty

# A build tag such as ffmpeg-9.0.2-2 is not a release: the version comes from the v* tags only.
git:
  ignore_tags:
    - "ffmpeg-*"

before:
  hooks:
    # Hooks are plain commands (no dir key), so the web build runs in a shell.
    - bash -c "cd web && bun install --frozen-lockfile && bun run build"
    # Assert the web build output: without it the binary compiles and ships
    # without the UI (the embed directive also matches public/robots.txt).
    - bash scripts/assert-web-build.sh

builds:
  - id: stuarty
    main: ./web/cmd/app
    binary: stuarty
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/AlexGalhardo/stuarty/web/app/agentdocs.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "stuarty_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.md
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - licenses/**/*
      # The three files of agent:docs, generated into web/app/agentdocs/out/; a CI check
      # compares them with the output of agent:docs --print (SDD-003 section 9 check 27).
      - src: web/app/agentdocs/out/SKILL.md
        dst: agent/skills/stuarty/SKILL.md
      - src: web/app/agentdocs/out/AGENTS.snippet.md
        dst: agent/AGENTS.snippet.md
      - src: web/app/agentdocs/out/mcp-instructions.txt
        dst: agent/mcp-instructions.txt

# The Debian packages (SDD-009 section 10.4, P1-REL-010), made by nfpm inside GoReleaser: the
# program in /usr/bin and the desktop entry that runs "stuarty open". They are artifacts of
# the release like the archives, so checksums.txt lists them and GoReleaser uploads them.
# The Windows, AppImage and macOS installers need tools of their own and are built by
# .github/workflows/installers.yml, then added to the release by release.yml.
nfpms:
  - id: stuarty-deb
    package_name: stuarty
    ids: [stuarty]
    formats: [deb]
    file_name_template: "stuarty_{{ .Version }}_linux_{{ .Arch }}"
    maintainer: Stuarty <stuarty@users.noreply.github.com>
    homepage: https://github.com/AlexGalhardo/stuarty
    description: A video editor for people and for AI agents, run on your own machine.
    license: MIT
    section: video
    priority: optional
    # An installed Vukem Video package is replaced by this one (ADR-0044).
    replaces: [vukem-video]
    conflicts: [vukem-video]
    contents:
      - src: .config/installers/linux/stuarty.desktop
        dst: /usr/share/applications/stuarty.desktop
        file_info:
          mode: 0644
      - src: .config/installers/assets/stuarty.png
        dst: /usr/share/icons/hicolor/256x256/apps/stuarty.png
        file_info:
          mode: 0644
      - src: LICENSE.md
        dst: /usr/share/doc/stuarty/LICENSE.md
        file_info:
          mode: 0644
      # RF-215: every installer carries the notices and the licence texts, like the archives.
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/stuarty/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644
      - src: licenses
        dst: /usr/share/doc/stuarty/licenses
        type: tree

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive (<archive>.sbom.json); needs syft on PATH.
sboms:
  - artifacts: archive

# Keyless: cosign gets its identity from the GitHub Actions OIDC token, so this
# only works in release.yml (a local snapshot passes --skip=sign). Signing
# checksums.txt covers every archive and SBOM it lists.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  mode: keep-existing
  prerelease: auto
