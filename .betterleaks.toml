# Betterleaks (https://github.com/betterleaks/betterleaks) secret scanning:
# the default rules plus the secret formats a vukem app holds. The pre-commit
# hook, the secrets:scan script and the CI job pick this file up by name.
# Validation against live provider APIs stays off: it needs --validation.
title = "vukem app"

[extend]
useDefault = true
# Replaced by stripe-secret-key below, which also matches low-entropy keys.
disabledRules = ["stripe-access-token"]

[[rules]]
id = "vukem-app-key"
description = "vukem APP_KEY or APP_PREVIOUS_KEYS entry (base64 of 32 random bytes)"
regex = '''base64:[A-Za-z0-9+/]{43}='''
keywords = ["base64:"]

[[rules]]
id = "vukem-api-token"
description = "vukem API token (auth.Tokens, default prefix vk_)"
regex = '''\bvk_[A-Z2-7]{26}\.[A-Z2-7]{26}\b'''
keywords = ["vk_"]

[[rules]]
id = "stripe-secret-key"
description = "Stripe secret or restricted API key"
regex = '''\b(?:sk|rk)_(?:test|live)_[A-Za-z0-9]{20,247}\b'''
keywords = ["sk_test_", "sk_live_", "rk_test_", "rk_live_"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''\bwhsec_[A-Za-z0-9+/=]{20,}'''
keywords = ["whsec_"]

# .env.example and the docs carry placeholders, never real values: allow the
# placeholder spellings only. A real key pasted into .env.example still fails.
[[allowlists]]
description = "placeholder values in .env.example, docs and tests"
regexTarget = "secret"
regexes = [
	'''_FAKE_|(?i)placeholder|changeme|example''',
	'''(?i)x{8,}|\.\.\.$''',
	'''correct horse battery|another long password|a brand new password''',
	'''^(wrong|guess|Show password|Hide password|Password)$''',
	'''^e2e-[a-z]+-password-[0-9]+$''',  # fake passwords of the network-mode e2e users (web/e2e/support/network.ts)
]

# The specifications in docs/sdds/ show example actor ids (key:key_<10 characters>,
# SDD-000 section 2). They are documentation, not secrets: reviewed and approved
# by the author in P1-REL-001 (7 findings). Both conditions must hold, so the
# same string outside docs/sdds/ is still reported.
[[allowlists]]
description = "documented example actor ids in docs/sdds/"
condition = "AND"
paths = ['''^docs/sdds/.*\.md$''']
regexTarget = "match"
regexes = ['''key:key_[a-z0-9]{10}''']

# P1-ENG-001 first committed id-like constants named clipKey, capKey and assetKey and an
# example actor id in core/command tests; Betterleaks read them as generic API keys.
# They were renamed in the next commits, but rebase-merged history keeps the old
# lines in the scanned range. Only those lines are allowed, only in core tests.
[[allowlists]]
description = "P1-ENG-001 historical test identifiers (renamed later) in core tests"
condition = "AND"
paths = ['''^core/.+_test\.go$''']
regexTarget = "line"
regexes = ['''\b(?:clip|cap|asset)Key\s*=|key:key_[a-z0-9]{10}''']

# Actor ids such as key:key_h8v2n5q7w3 name an API key; they are public
# identifiers (SDD-000 section 2), the secret is the token. Go tests and the
# editor's comments and fixtures use them as examples. Only this exact shape,
# only in Go test files and the editor sources.
[[allowlists]]
description = "example actor ids in Go tests and the editor"
condition = "AND"
paths = ['''(?:_test\.go|^web/resources/js/.+\.tsx?)$''']
regexTarget = "match"
regexes = ['''key:key_[a-z0-9]{10}''']

# Network-mode login (P2-SRV-012): the name of the variable that carries the
# first administrator's password, the deliberately weak "short" password of the
# refusal test, and login bodies that Go tests build from a variable (the
# literal next to "password" is the closing backtick, not a value). Only these
# line shapes, only in web/app/auth and web/app/http.
[[allowlists]]
description = "network-mode login variable name and test login bodies"
condition = "AND"
paths = ['''^web/app/(?:auth|http)/[^/]+\.go$''']
regexTarget = "line"
regexes = [
	'''EnvAdminPassword\s*=\s*"VUKEM_VIDEO_ADMIN_PASSWORD"''',
	'''auth\.EnvAdminPassword:\s*"short"''',
	'''"password":"`\s*\+\s*(?:password|goodPass)\s*\+\s*`"''',
]

# The navigation policy test of the desktop shell feeds URLs whose userinfo
# tries to pass an outside host as the local one (http://127.0.0.1:x@evil.com/).
# They hold no credential. Only that host, only in that test file.
[[allowlists]]
description = "userinfo tricks in the desktop navigation test"
condition = "AND"
paths = ['''^desktop/shell/navigate_test\.go$''']
regexTarget = "match"
regexes = ['''@evil\.com''']

# The login form labels ("Password", "Senha") in the UI catalogues, and the
# self-hosting pages that show the secret file reference and a sample password
# to replace. None is a credential. Only these values, only in those files.
[[allowlists]]
description = "login labels in the UI catalogues and sample values in self-hosting docs"
condition = "AND"
paths = ['''^(?:web/resources/lang/[A-Za-z-]+\.json|site/content/docs/[a-z-]+/(?:self-hosting|getting-started)/[a-z-]+\.mdx|scripts/first-export-timing\.sh)$''']
regexTarget = "secret"
regexes = ['''^(?:Password|Senha|@file:/run/secrets/admin_password|choose-a-long-password|a-long-password-here)$''']

# The FFmpeg build inputs are pinned by SHA-256 (64 hex characters) in sources.env; a digest is
# public data, not a secret. Both conditions must hold, so a real key elsewhere is still reported.
[[allowlists]]
description = "SHA-256 digests of the pinned FFmpeg build inputs"
condition = "AND"
paths = ['''^\.config/ffmpeg-build/sources\.env$''']
regexTarget = "line"
regexes = ['''[A-Z0-9_]+_SHA256="[0-9a-f]{64}"''']

# The help test of the CLI maps a command name to its usage line ("user:passwd": "vukem-video
# user:passwd <email>"); Betterleaks reads the usage as a password. Only that line shape, only in
# that test file.
[[allowlists]]
description = "usage lines of the user commands in the CLI help test"
condition = "AND"
paths = ['''^web/app/cli/help_test\.go$''']
regexTarget = "line"
regexes = ['''"user:(?:create|passwd)":\s*"vukem-video user:(?:create|passwd) <email>''']

# The API reference pages are generated from the OpenAPI document, whose request examples put the
# JSON type name where a value goes ("password": "string"). Only that placeholder, only in those pages.
[[allowlists]]
description = "type-name placeholders in the generated API reference"
condition = "AND"
paths = ['''^site/content/generated/api/[^/]+\.mdx$''']
regexTarget = "secret"
regexes = ['''^string$''']
